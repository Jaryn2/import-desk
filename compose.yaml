name: import-desk
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python scripts/setup.py first}
      POSTGRES_DB: importdesk
    volumes: [data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U portfolio']
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://portfolio:${DB_PASSWORD}@db:5432/importdesk
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Run python scripts/setup.py first}
    depends_on:
      db:
        condition: service_healthy
    ports: ['127.0.0.1:5402:8000']
  worker:
    build: .
    command: [python, -m, app.worker]
    environment:
      DATABASE_URL: postgresql://portfolio:${DB_PASSWORD}@db:5432/importdesk
    depends_on:
      db:
        condition: service_healthy
volumes:
  data:
